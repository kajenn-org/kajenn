<svg xmlns="http://www.w3.org/2000/svg" width="660" height="591" viewBox="0 0 660 591" role="img" aria-labelledby="title desc">
<title id="title">HTTP: from connection to handler</title><desc id="desc">HTTP enters enabled middleware, then core admission and mount selection. The routed application parses and binds arguments before calling the handler.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527184"/></marker></defs>
<rect width="660" height="591" rx="16" fill="#f4f7fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183042">
<text x="30" y="36" font-size="19" font-weight="700">HTTP: from connection to handler</text>
<rect x="30" y="62" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="89" font-size="17" font-weight="700">ASGI host · uvicorn</text>
<text x="48" y="113" font-size="15">Delivers the HTTP scope, receive and send.</text>
<path d="M 330 133 V 153" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="158" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="185" font-size="17" font-weight="700">Enabled middleware</text>
<text x="48" y="209" font-size="15">Wraps dispatch; a layer may answer without calling the application.</text>
<path d="M 330 229 V 249" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="254" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="281" font-size="17" font-weight="700">Core admission and mount selection</text>
<text x="48" y="305" font-size="15">Rejects dispatch while stopping; selects the named mount or root app.</text>
<path d="M 330 325 V 345" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="350" width="600" height="68" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="377" font-size="17" font-weight="700">RoutedApplication</text>
<text x="48" y="401" font-size="15">Request owns body parsing; routing and plugins bind arguments.</text>
<path d="M 330 421 V 441" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="446" width="600" height="68" rx="9" fill="#e6f3ef" stroke="#76a99b"/>
<text x="48" y="473" font-size="17" font-weight="700">Handler and response</text>
<text x="48" y="497" font-size="15">Return a value or response; the response writes through ASGI send.</text>
<text x="30" y="569" font-size="14">Direct HTTP may stream a response. WSX follows a different entry path.</text>
</g></svg>
