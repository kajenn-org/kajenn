<svg xmlns="http://www.w3.org/2000/svg" width="660" height="583" viewBox="0 0 660 583" role="img" aria-labelledby="title desc">
<title id="title">Configuration: declarations and effective values</title><desc id="desc">Package defaults, optional host defaults and site recipe are merged. The handler reads values and resolvers. Explicit server constructor arguments override configured arguments.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#527184"/></marker></defs>
<rect width="660" height="583" rx="16" fill="#f4f7fa"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#183042">
<text x="30" y="36" font-size="19" font-weight="700">Configuration: declarations and effective values</text>
<rect x="30" y="62" width="600" height="90" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="89" font-size="17" font-weight="700">1 · Layer the recipes</text>
<text x="48" y="113" font-size="15">BaseConfiguration → optional defaults file → site recipe</text>
<text x="48" y="135" font-size="15">Later layers win attribute by attribute.</text>
<path d="M 330 155 V 175" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="180" width="600" height="90" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="207" font-size="17" font-weight="700">2 · Read through ConfigurationHandler</text>
<text x="48" y="231" font-size="15">Written value → grammar default → call-site default → KeyError</text>
<text x="48" y="253" font-size="15">EnvResolver evaluates when its configured value is read.</text>
<path d="M 330 273 V 293" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="298" width="600" height="90" rx="9" fill="#fff" stroke="#bfced8"/>
<text x="48" y="325" font-size="17" font-weight="700">3 · Construct AsgiServer</text>
<text x="48" y="349" font-size="15">Explicit constructor kwargs override configured kwargs.</text>
<text x="48" y="371" font-size="15">A value copied at boot does not become a live setting automatically.</text>
<path d="M 330 391 V 411" fill="none" stroke="#527184" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="30" y="416" width="600" height="90" rx="9" fill="#e6f3ef" stroke="#76a99b"/>
<text x="48" y="443" font-size="17" font-weight="700">4 · Read the original configuration</text>
<text x="48" y="467" font-size="15">server.config(path) reads the configuration tree.</text>
<text x="48" y="489" font-size="15">app.config(path) addresses that application’s subtree.</text>
<text x="30" y="561" font-size="14">A constructor override changes effective server settings, not the recipe tree.</text>
</g></svg>
